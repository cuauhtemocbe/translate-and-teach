name: Dependabot Socket Firewall

on:
  pull_request:
    branches: [main]

jobs:
  socket-check:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # ubuntu-latest is glibc, so corepack works fine here (the musl bug only affects Alpine images)
      - name: Enable package manager
        run: corepack enable && corepack prepare pnpm@9.0.0 --activate

      - uses: SocketDev/action@ba6de6cc0565af1f42295590380973573297e31f # v1.3.2
        with:
          mode: firewall-free

      - name: Install with firewall
        id: install
        run: sfw pnpm install
        continue-on-error: true

      - name: Close PR if firewall blocked something
        if: steps.install.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr close ${{ github.event.pull_request.number }} \
            --comment "🚫 Socket Firewall blocked this dependency for known malicious/compromised behavior. Closed automatically."
