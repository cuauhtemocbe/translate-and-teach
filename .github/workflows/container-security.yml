name: Container security

# Image CVE scan + Dockerfile misconfig scan (meta-projects#56). The lockfile
# scan in the pre-push hook cannot see base-image OS packages; this can.
# Scheduled weekly because base-image CVEs land without any code change.

on:
  pull_request:
    # No `paths:` filter: trivy-image and trivy-config are required checks in
    # branch protection, and a path-filtered required check never reports on
    # PRs that don't touch those files, leaving the merge blocked.
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  trivy-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # Same placeholder build args as ci.yml's docker-build (Vite inlines them
      # at build time, so never use a real key here). Never pushed.
      - name: Build production image
        run: |
          docker build \
            --build-arg VITE_TOGETHER_API_KEY=ci-placeholder \
            --build-arg VITE_TOGETHER_MODEL=ci-placeholder \
            -t translate-and-teach:scan .
      - name: Trivy image scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: image
          image-ref: translate-and-teach:scan
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

  trivy-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Trivy Dockerfile misconfig scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: .
          # Dockerfile.dev is local-only tooling, not a production image.
          skip-files: Dockerfile.dev
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
